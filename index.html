<style>
/* Jagannath Fabrics — Design tokens */
:root {
  /* Color palette — heritage × modern luxury */
  --cream: #EFE9DD;
  --cream-50: #F7F3EA;
  --cream-100: #EFE9DD;
  --cream-200: #E4DCCB;
  --cream-300: #D4C9B2;
  --ink: #1A1410;
  --ink-soft: #2B2420;
  --ink-60: rgba(26, 20, 16, 0.6);
  --ink-40: rgba(26, 20, 16, 0.4);
  --ink-20: rgba(26, 20, 16, 0.2);
  --ink-10: rgba(26, 20, 16, 0.1);
  --ink-05: rgba(26, 20, 16, 0.05);
  --bone: #FAF6ED;
  --paper: #F3ECDE;

  /* Brand deep tones */
  --plum: #4A1C2E;       /* deep wine — secondary */
  --terracotta: #A8663C; /* earth — tertiary */
  --gold: #B8955F;       /* antique gold */

  /* Accent — tweakable */
  --accent: #B23A2E;     /* vermilion (default) */
  --accent-soft: color-mix(in oklab, var(--accent) 14%, var(--cream-100));
  --accent-ink: color-mix(in oklab, var(--accent) 80%, #000);

  /* Typography */
  --serif: "Fraunces", "Cormorant Garamond", "EB Garamond", Georgia, serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;
  --s-10: 128px;

  /* Radii */
  --r-xs: 2px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 14px;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(26,20,16,0.06), 0 1px 1px rgba(26,20,16,0.04);
  --shadow-md: 0 6px 20px -8px rgba(26,20,16,0.18), 0 2px 6px rgba(26,20,16,0.06);
  --shadow-lg: 0 24px 60px -20px rgba(26,20,16,0.25);

  /* Layout */
  --container: 1360px;
  --gutter: clamp(20px, 4vw, 56px);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--cream-100);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--accent); color: var(--bone); }

h1, h2, h3, h4, h5 {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--ink);
  text-wrap: balance;
}

h1 { font-size: clamp(48px, 7vw, 104px); line-height: 0.98; letter-spacing: -0.035em; }
h2 { font-size: clamp(36px, 5vw, 72px); line-height: 1.02; letter-spacing: -0.03em; }
h3 { font-size: clamp(24px, 2.6vw, 36px); line-height: 1.15; }
h4 { font-size: clamp(18px, 1.5vw, 22px); line-height: 1.3; font-family: var(--sans); font-weight: 500; letter-spacing: 0; }

p { margin: 0; text-wrap: pretty; }

a { color: inherit; text-decoration: none; }

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

input, textarea, select {
  font-family: inherit;
  color: inherit;
}

.mono {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
}

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-60);
  font-weight: 500;
}

.serif-italic { font-family: var(--serif); font-style: italic; font-weight: 300; }

.container {
  max-width: var(--container);
  margin: 0 auto;
  padding: 0 var(--gutter);
}

.divider {
  height: 1px;
  background: var(--ink-10);
  width: 100%;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 22px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
  border-radius: 999px;
  transition: all 0.25s cubic-bezier(.2,.7,.2,1);
  border: 1px solid transparent;
  white-space: nowrap;
}
.btn-primary {
  background: var(--ink);
  color: var(--bone);
}
.btn-primary:hover {
  background: var(--accent);
  transform: translateY(-1px);
}
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--ink-20);
}
.btn-ghost:hover {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--bone);
}
.btn-accent {
  background: var(--accent);
  color: var(--bone);
}
.btn-accent:hover {
  background: var(--accent-ink);
  transform: translateY(-1px);
}

.btn .arrow {
  display: inline-block;
  transition: transform 0.25s;
}
.btn:hover .arrow { transform: translateX(4px); }

/* Link underline */
.link-underline {
  position: relative;
  display: inline-block;
}
.link-underline::after {
  content: "";
  position: absolute;
  left: 0; bottom: -2px;
  width: 100%;
  height: 1px;
  background: currentColor;
  transform: scaleX(0.3);
  transform-origin: left;
  transition: transform 0.35s cubic-bezier(.2,.7,.2,1);
}
.link-underline:hover::after { transform: scaleX(1); }

/* Image placeholder */
.fabric-placeholder {
  position: relative;
  background:
    repeating-linear-gradient(45deg, rgba(26,20,16,0.05) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(-45deg, rgba(26,20,16,0.04) 0 1px, transparent 1px 6px),
    linear-gradient(135deg, var(--cream-200), var(--cream-300));
  overflow: hidden;
  border-radius: var(--r-sm);
}
.fabric-placeholder .label {
  position: absolute;
  inset: auto auto 12px 12px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-60);
  background: var(--cream-50);
  padding: 4px 8px;
  border-radius: 2px;
  border: 1px solid var(--ink-10);
}

/* Jacquard SVG pattern (decorative) */
.pattern-jacquard {
  background-color: var(--cream-100);
  background-image:
    radial-gradient(circle at 20% 30%, color-mix(in oklab, var(--accent) 10%, transparent) 0, transparent 40%),
    radial-gradient(circle at 80% 70%, color-mix(in oklab, var(--ink) 8%, transparent) 0, transparent 40%);
}

/* Scroll smooth */
html { scroll-behavior: smooth; }

/* Focus */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 2px;
}

/* Page transition */
.page-enter {
  animation: pageIn 0.5s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-up {
  animation: fadeUp 0.7s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Marquee */
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* Scrollbar subtle */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--cream-100); }
::-webkit-scrollbar-thumb { background: var(--ink-20); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-40); }

:root { color-scheme: light; }
html, body { background: var(--cream-100); color: var(--ink); overflow-x: hidden; }
a[onclick], a:not([href]) { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
